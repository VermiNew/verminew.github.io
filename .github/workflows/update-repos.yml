name: Update Repository Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: Refresh the timestamp even when repository data is unchanged
        required: false
        type: boolean
        default: false
      dry_run:
        description: Generate and validate data without committing it
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/scripts/fetch-repos.js'
      - '.github/workflows/update-repos.yml'
      - 'scripts/validate-project.js'
  repository_dispatch:
    types: [update_projects]

permissions:
  contents: write

concurrency:
  group: update-repository-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 💾 Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-update-deps-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-update-deps-

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📡 Fetch repository data
        env:
          FORCE_UPDATE: ${{ inputs.force_update || false }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          echo "📊 Starting repository data fetch..."
          node .github/scripts/fetch-repos.js
          echo "✅ Fetch complete!"

      - name: Validate generated data
        run: npm run validate

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- public/data/repos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "### Repository data changes" >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- public/data/repos.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push data
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/repos.json
          git commit -m "chore(automation): update repository data" -m "Triggered by: ${EVENT_NAME}"
          git push

      # A push made with GITHUB_TOKEN does not start normal push workflows.
      # repository_dispatch is one of the documented exceptions, so deployment is explicit.
      - name: Trigger Pages deployment
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='deploy_pages' \
            -F client_payload[source_workflow]="${GITHUB_WORKFLOW}" \
            -F client_payload[source_run_id]="${GITHUB_RUN_ID}"

      - name: Summary
        if: always()
        run: |
          echo "### ℹ️  No Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Repository data is already up to date." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Checked at**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
