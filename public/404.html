<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a1929" />
    <title>404 — VermiNew</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #0a1929;
        color: #e2e8f0;
      }

      main {
        width: min(34rem, calc(100% - 2rem));
        padding: 2rem;
        text-align: center;
        border: 1px solid #334155;
        border-radius: 1rem;
        background: #10243a;
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 30%);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 8vw, 4rem);
        color: #60a5fa;
      }

      p {
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.6rem;
        background: #2563eb;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #f8fafc;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Ta strona nie istnieje. The requested page could not be found.</p>
      <a href="/?lang=pl">Wróć do portfolio / Return home</a>
    </main>
  </body>
</html>
